# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# https://peps.python.org/pep-0621/
[project]
name = "riap"
description = "package description."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "elearomy.gros@unibe.ch", name = "Éléa Gros" },
    { email = "", name = "Arnas Jankauskas" },
]
dynamic = ["version"]
dependencies = ["imagecodecs", "Pillow", "matplotlib", "numpy", "pandas", "scipy", "tqdm", "openpyxl", "tifffile", "simpleitk", "jupyter", "opencv-python"]

[tool.hatch.version]
path = "src/riap/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# extras
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
[project.optional-dependencies]
test = ["pytest>=6.0"]

[project.urls]
homepage = "https://github.com/eleagros/riap"
repository = "https://github.com/eleagros/riap"
